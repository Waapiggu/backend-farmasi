  <div class="main-content">
    <div class="top-header">
      <div class="header-left">
        <h1>Daftar Pasien</h1>
        <div class="breadcrumb">Dokter / Daftar Pasien</div>
      </div>
    </div>

    <div class="page-content">
      <div class="card">
        <!-- Toolbar / Filter -->
        <div class="toolbar">
          <div class="search-group search-w-260">
            <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input type="text" id="search-input" class="form-control" placeholder="Cari berdasarkan nama atau NIK..." oninput="applyFilter()"/>
          </div>
          <div class="spacer"></div>
          <span id="result-count" class="text-muted-sm"></span>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>No. Antrian</th>
                <th>Nama Pasien</th>
                <th>NIK</th>
                <th>Waktu Daftar</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tb-antrian-pasien">
              <tr><td colspan="6"><div class="empty-state"><div class="spinner"></div><p>Memuat data...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="../js/mock-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
  Auth.requireAuth('dokter');
  Auth.renderUserInfo();

  let allAntrian = [];
  let filtered   = [];
  const user = Auth.getUser();

  async function loadAntrian() {
    try {
      allAntrian = await API.getAntrian(user?.id);
      
      // Sort: status 'menunggu' at the top, then by time
      allAntrian.sort((a, b) => {
        if (a.status === 'menunggu' && b.status !== 'menunggu') return -1;
        if (a.status !== 'menunggu' && b.status === 'menunggu') return 1;
        return new Date(a.waktu_daftar) - new Date(b.waktu_daftar);
      });

      filtered = [...allAntrian];
      render();
    } catch(e) { 
      Utils.toast('error', 'Gagal memuat', e.message); 
    }
  }

  function applyFilter() {
    const q = document.getElementById('search-input').value.toLowerCase();
    filtered = allAntrian.filter(p => {
      return !q || 
             p.patient_name.toLowerCase().includes(q) || 
             p.patient_nik.toLowerCase().includes(q) || 
             p.kunjungan_id.toLowerCase().includes(q);
    });
    render();
  }

  function render() {
    const tb = document.getElementById('tb-antrian-pasien');
    document.getElementById('result-count').textContent = `${filtered.length} pasien ditemukan`;

    if (!filtered.length) { 
      tb.innerHTML = Utils.emptyRow(6, 'Tidak ada pasien yang sesuai filter'); 
      return; 
    }

    tb.innerHTML = filtered.map(a => `
      <tr>
        <td><div class="td-main">${a.kunjungan_id}</div></td>
        <td><div class="td-main">${a.patient_name}</div></td>
        <td><div class="td-sub">${a.patient_nik}</div></td>
        <td>${Utils.formatDateTime(a.waktu_daftar)}</td>
        <td>${Utils.statusBadge(a.status === 'menunggu' ? 'active' : a.status === 'selesai' ? 'completed' : 'cancelled')}</td>
        <td>
          ${a.status === 'menunggu' 
            ? `<button class="btn btn-primary btn-sm" onclick="periksaPasien('${a.kunjungan_id}', '${a.patient_nik}', '${a.patient_name}')">Periksa Pasien</button>` 
            : `<span class="text-muted-sm">Selesai</span>`}
        </td>
      </tr>
    `).join('');
  }

  function periksaPasien(kunjunganId, nik, nama) {
    window.location.href = `rekam-medis.html?kunjungan=${kunjunganId}&nik=${nik}&nama=${encodeURIComponent(nama)}`;
  }

  loadAntrian();
</script>
</body>
