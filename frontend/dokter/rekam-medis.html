<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rekam Medis — SisFarmasi</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .patient-header {
      background: rgba(43, 190, 166, 0.05);
      border: 1px solid rgba(43, 190, 166, 0.2);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .patient-header-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .patient-header-info .name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-color);
    }
    .patient-header-info .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
    }
  </style>
</head>
<body><div class="app-layout">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg></div>
      <div class="logo-text"><span>SisFarmasi</span><span>SatuSehat</span></div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="sidebar-user-avatar">?</div>
      <div class="user-info">
        <span id="sidebar-user-name">Loading...</span>
        <span id="sidebar-user-role">Dokter</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <a href="dashboard.html"      class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="15" width="7" height="6"/></svg></span> Dashboard</a>
      <a href="daftar-pasien.html"  class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Daftar Pasien</a>
      <a href="riwayat-pasien.html" class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></span> Riwayat Pasien</a>
      <a href="resep-baru.html"     class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span> Tulis Resep Baru</a>
      <a href="riwayat-resep.html"  class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span> Riwayat Resep</a>
      <div class="nav-section-label nav-section-label-spaced">Referensi</div>
      <a href="stok.html" class="nav-item"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span> Stok Obat</a>
    </nav>
    <div class="sidebar-footer">
      <div class="nav-item nav-logout" onclick="Auth.logout()"><span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span> Keluar</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">
    <div class="top-header">
      <div class="header-left">
        <h1>Input Rekam Medis</h1>
        <div class="breadcrumb">Dokter / Dashboard / Rekam Medis</div>
      </div>
    </div>

    <div class="page-content">
      
      <div class="patient-header">
        <div class="patient-header-info">
          <div class="name" id="ph-nama">-</div>
          <div class="meta">
            <span><strong>NIK:</strong> <span id="ph-nik">-</span></span>
            <span><strong>Kunjungan ID:</strong> <span id="ph-kunjungan">-</span></span>
          </div>
        </div>
        <div class="stat-icon teal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
      </div>

      <div class="card">
        <div class="card-body">
          <form id="form-rekam-medis" onsubmit="return handleSimpan(event)">
            <div class="form-row">
              <div class="form-group grid-col-full">
                <label for="input-keluhan">Keluhan Pasien <span class="text-danger">*</span></label>
                <textarea id="input-keluhan" class="form-control" rows="3" placeholder="Masukkan keluhan utama dan tambahan pasien..." required></textarea>
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group grid-col-full">
                <label for="input-hasil">Hasil Pemeriksaan <span class="text-danger">*</span></label>
                <textarea id="input-hasil" class="form-control" rows="4" placeholder="Tanda vital, pemeriksaan fisik, dan penunjang..." required></textarea>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group grid-col-full">
                <label for="input-catatan">Catatan / Diagnosis</label>
                <textarea id="input-catatan" class="form-control" rows="3" placeholder="Diagnosis, alergi, atau catatan lainnya untuk resep..."></textarea>
              </div>
            </div>

            <div class="divider mb-lg"></div>

            <div class="flex-end-gap">
              <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Kembali</button>
              <button type="submit" class="btn btn-primary" id="btn-simpan">Simpan & Tulis Resep →</button>
            </div>
          </form>
        </div>
      </div>

    </div><!-- end page-content -->
  </div><!-- end main-content -->
</div>

<div id="toast-container"></div>

<script src="../js/mock-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script>
  Auth.requireAuth('dokter');
  Auth.renderUserInfo();

  const urlParams = new URLSearchParams(window.location.search);
  const kunjunganId = urlParams.get('kunjungan');
  const nik = urlParams.get('nik');
  const nama = urlParams.get('nama');

  if (!kunjunganId || !nik) {
    Utils.toast('error', 'Data tidak lengkap', 'Tidak ada data kunjungan yang diplih.');
    setTimeout(() => window.location.href = 'dashboard.html', 2000);
  } else {
    document.getElementById('ph-nama').textContent = nama || '-';
    document.getElementById('ph-nik').textContent = nik;
    document.getElementById('ph-kunjungan').textContent = kunjunganId;
  }

  async function handleSimpan(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-simpan');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    const payload = {
      kunjungan_id: kunjunganId,
      patient_nik: nik,
      keluhan: document.getElementById('input-keluhan').value,
      hasil_pemeriksaan: document.getElementById('input-hasil').value,
      catatan: document.getElementById('input-catatan').value
    };

    try {
      const res = await API.createRekamMedis(payload);
      Utils.toast('success', 'Tersimpan', 'Rekam medis berhasil disimpan.');
      
      // Lanjut ke resep baru, bawa parameter
      setTimeout(() => {
        window.location.href = `resep-baru.html?rm_id=${res.data.rekam_medis_id}&nik=${nik}&nama=${encodeURIComponent(nama)}`;
      }, 1500);
      
    } catch (err) {
      Utils.toast('error', 'Gagal', err.message);
      btn.disabled = false;
      btn.textContent = 'Simpan & Tulis Resep →';
    }
  }

</script>
</body>
</html>
